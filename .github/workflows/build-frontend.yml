name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'AI-frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AI-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build-only
        env:
          VITE_API_BASE_URL: /api
          VITE_PREVIEW_BASE_URL: /api/static
          VITE_DEPLOY_BASE_URL: ${{ vars.VITE_DEPLOY_BASE_URL || 'https://example.com' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: AI-frontend/dist/
          retention-days: 30
